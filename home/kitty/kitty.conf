# font_family      JetBrainsMono Nerd Font
font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
confirm_os_window_close 0

font_size 13.0

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

enable_audio_bell no

window_padding_width 1

disable_ligatures always

background_opacity 1

hide_window_decorations yes

# cursor_trail 2
# cursor_trail_decay 0.1 0.2

include ./kitty-themes/themes/Tokyonight_Storm.conf

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+kp_add change_font_size all +1.0
map cmd+plus change_font_size all +1.0
map cmd+equal change_font_size all +1.0
map shift+cmd+equal change_font_size all +1.0

map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map cmd+minus change_font_size all -1.0
map shift+cmd+minus change_font_size all -1.0
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
